<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Rebelz</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Roboto, sans-serif; background: #0f1115; color: #e6e6e6;
         display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;
           border-bottom: 1px solid #222; }
  header b { font-size: 18px; }
  header small { color: #8a93a6; margin-left: 8px; }
  button { background: #2b6cff; color: #fff; border: 0; border-radius: 10px; padding: 10px 14px; font-size: 15px; }
  button:disabled { opacity: .5; }
  #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 90%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
  .user { align-self: flex-end; background: #2b6cff; }
  .bot { align-self: flex-start; background: #1c1f26; }
  .trace { align-self: flex-start; font-size: 12px; color: #8a93a6; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 95%; }
  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #222; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  textarea { flex: 1; resize: none; border-radius: 10px; border: 1px solid #333; background: #15181e; color: #fff;
             padding: 10px; font-size: 16px; font-family: inherit; max-height: 160px; }
</style>
</head>
<body>
<header>
  <div><b>Rebelz</b><small id="status"></small></div>
  <button id="reset" type="button">Yeni sohbet</button>
</header>
<div id="log"></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Bir şey yaz veya görev ver..."></textarea>
  <button id="send" type="submit">Gönder</button>
</form>
<script>
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const form = document.getElementById('form');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');

  let sid = localStorage.getItem('rebelz_sid');
  if (!sid) {
    sid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
    localStorage.setItem('rebelz_sid', sid);
  }

  function add(cls, text) {
    const el = document.createElement('div');
    el.className = cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function post(path, body, retried) {
    const res = await fetch(path, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + (localStorage.getItem('rebelz_token') || ''),
      },
      body: JSON.stringify(body),
    });
    if (res.status === 401 && !retried) {
      const token = prompt('Erişim anahtarı (sunucudaki REBELZ_WEB_TOKEN):');
      if (!token) throw new Error('Erişim anahtarı girilmedi.');
      localStorage.setItem('rebelz_token', token.trim());
      return post(path, body, true);
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  async function loadHealth() {
    try {
      const res = await fetch('/api/health');
      const h = await res.json();
      statusEl.textContent = 'otonomi: ' + h.autonomy + ' · model: ' + h.model;
    } catch (e) {
      statusEl.textContent = 'sunucuya ulaşılamıyor';
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    sendBtn.disabled = true;
    add('msg user', text);
    const pending = add('msg bot', 'Düşünüyor…');
    try {
      const data = await post('/api/chat', { session: sid, message: text });
      pending.textContent = data.reply;
      if (data.trace && data.trace.length) {
        add('trace', data.trace.map(t => '🔧 ' + t.tool + ' ' + JSON.stringify(t.args) + '\n   → ' + String(t.result).slice(0, 200)).join('\n'));
      }
    } catch (err) {
      pending.textContent = 'Hata: ' + err.message;
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      form.requestSubmit();
    }
  });

  document.getElementById('reset').addEventListener('click', async () => {
    if (!confirm('Sohbet geçmişi sıfırlansın mı? (Kalıcı notlar silinmez)')) return;
    try {
      await post('/api/reset', { session: sid });
      log.innerHTML = '';
    } catch (err) {
      alert('Sıfırlanamadı: ' + err.message);
    }
  });

  loadHealth();
</script>
</body>
</html>
